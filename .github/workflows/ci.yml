name: CI (Build & Demo)

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key -O /tmp/llvm.key
          sudo apt-key add /tmp/llvm.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-15 main"
          sudo apt-get update
          sudo apt-get install -y llvm-15 llvm-15-dev clang-15 graphviz

      - name: Install llvmlite (editable) and deps
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-15
        run: |
          python -m pip install -U pip
          # Try local build; if it fails, fallback to released llvmlite
          (pip install -e .) || pip install llvmlite
          pip install numpy matplotlib pytest

      - name: Run demo
        run: |
          python demo/run.py --benchmark --save

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifacts-py${{ matrix.python-version }}
          path: demo/out/
